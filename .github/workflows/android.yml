name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - name: Gradle build
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Stockfish for Android arm64
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          export CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          sed -i 's/-lpthread//g' /tmp/stockfish/src/Makefile
          make -C /tmp/stockfish/src -j2 build ARCH=armv8 COMP=clang CXX="$CXX"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/stockfish/src/stockfish app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessMateStudy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
